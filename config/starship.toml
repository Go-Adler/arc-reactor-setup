"$schema" = 'https://starship.rs/config-schema.json'

# ============================================================================
#  Arc Reactor — starship prompt
#
#  Deliberately NOT powerline: with background-filled powerline segments, any
#  module that renders empty (no git repo, no node project) leaves a colour
#  discontinuity in the separator chain. Each segment here carries its own
#  leading "╶" divider instead, so the line stays correct whatever is present.
#
#  red #e62429 · gold #f0a020 · cyan #55d9f0 · dim #5a4644
# ============================================================================

add_newline = true
command_timeout = 1200

format = """
[╭╴](fg:#5a4644)$username$hostname$directory$git_branch$git_status$nodejs$rust$python$golang$java$dart$docker_context$cmd_duration
[╰╴](fg:#5a4644)$character"""

# ------------------------------------------------------------------ identity --
[username]
show_always = true
style_user = "bold fg:#e62429"
style_root = "bold fg:#ff4d52"
format = '[⬢ ]($style)[$user](bold fg:#ece6e4)'

[hostname]
ssh_only = true
style = "fg:#a89a98"
format = '[@$hostname]($style)'

# ----------------------------------------------------------------- location --
[directory]
style = "bold fg:#f0a020"
format = ' [╶](fg:#5a4644) [$path]($style)[$read_only](fg:#e62429)'
read_only = "  "
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Desktop"   = " "

# ---------------------------------------------------------------------- git --
[git_branch]
symbol = " "
style = "bold fg:#55d9f0"
format = ' [╶](fg:#5a4644) [$symbol$branch]($style)'

[git_status]
style = "fg:#ff4d52"
format = '[ $all_status$ahead_behind]($style)'
conflicted = "‼ "
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "?${count}"
stashed    = "≡${count}"
modified   = "✚${count}"
staged     = "●${count}"
renamed    = "»${count}"
deleted    = "✘${count}"

[git_state]
style = "fg:#f0a020"
format = ' [╶](fg:#5a4644) [$state $progress_current/$progress_total]($style)'

# ------------------------------------------------------------------ runtimes --
[nodejs]
symbol = " "
style = "fg:#7bd88f"
format = ' [╶](fg:#5a4644) [$symbol$version]($style)'
detect_files = ["package.json", ".nvmrc"]

[rust]
symbol = " "
style = "fg:#ff8f52"
format = ' [╶](fg:#5a4644) [$symbol$version]($style)'

[python]
symbol = " "
style = "fg:#f0d020"
format = ' [╶](fg:#5a4644) [$symbol$version( $virtualenv)]($style)'

[golang]
symbol = " "
style = "fg:#55d9f0"
format = ' [╶](fg:#5a4644) [$symbol$version]($style)'

[java]
symbol = " "
style = "fg:#e05a4e"
format = ' [╶](fg:#5a4644) [$symbol$version]($style)'

[dart]
symbol = " "
style = "fg:#4fc9d9"
format = ' [╶](fg:#5a4644) [$symbol$version]($style)'

[docker_context]
symbol = " "
style = "fg:#55a9f0"
format = ' [╶](fg:#5a4644) [$symbol$context]($style)'
only_with_files = true

# -------------------------------------------------------------------- timing --
[cmd_duration]
min_time = 500
style = "fg:#a89a98"
format = ' [╶](fg:#5a4644) [󱎫 $duration]($style)'

# ------------------------------------------------------------------- prompt ---
[character]
success_symbol = "[❯](bold fg:#55d9f0)"
error_symbol   = "[❯](bold fg:#e62429)"
vimcmd_symbol  = "[❮](bold fg:#f0a020)"

# quiet down modules that would clutter a two-line HUD
[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true
