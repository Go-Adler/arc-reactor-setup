# ============================================================================
#  Arc Reactor — kitty
#  Palette: base #0d0b0b · red #e62429 · gold #f0a020 · reactor cyan #55d9f0
#
#  The blur behind this window comes from Blur My Shell's "applications"
#  component (whitelisted on WM_CLASS "kitty"), not from kitty itself —
#  kitty's own background_blur is a macOS/KDE feature. That is why
#  background_opacity is below 1: it lets the blurred layer show through.
# ============================================================================

# ------------------------------------------------------------------- fonts ---
font_family        JetBrainsMono Nerd Font
bold_font          JetBrainsMono Nerd Font Bold
italic_font        JetBrainsMono Nerd Font Italic
bold_italic_font   JetBrainsMono Nerd Font Bold Italic
font_size          11.0
disable_ligatures  never
modify_font        cell_height 108%

# ------------------------------------------------------------------ window ---
background_opacity        0.50
background_blur           0
window_padding_width      14 16
hide_window_decorations   titlebar-only
confirm_os_window_close   0
remember_window_size      no
initial_window_width      112c
initial_window_height     30c
placement_strategy        center
enable_audio_bell         no
visual_bell_duration      0
scrollback_lines          20000
cursor_shape              beam
cursor_beam_thickness     1.8
cursor_blink_interval     0.6
mouse_hide_wait           2.0
shell_integration         enabled
allow_remote_control      no
sync_to_monitor           yes
repaint_delay             8

# ---------------------------------------------------------------- tab bar ----
tab_bar_edge              top
tab_bar_style             powerline
tab_powerline_style       slanted
tab_bar_min_tabs          2
tab_title_template        "{index}  {title}"
active_tab_font_style     bold

# ============================================================================
#  Colours
# ============================================================================
background            #0d0b0b
foreground            #ece6e4
selection_background  #3a2c2e
selection_foreground  #ffffff

cursor                #55d9f0
cursor_text_color     #0d0b0b

url_color             #f0a020
visual_bell_color     #e62429
bell_border_color     #e62429

active_border_color   #e62429
inactive_border_color #3a2c2e

active_tab_background   #e62429
active_tab_foreground   #0d0b0b
inactive_tab_background #1f1a1a
inactive_tab_foreground #a89a98
tab_bar_background      #080707

mark1_foreground #0d0b0b
mark1_background #55d9f0
mark2_foreground #0d0b0b
mark2_background #f0a020
mark3_foreground #0d0b0b
mark3_background #e62429

# --- 16 colour palette -------------------------------------------------------
# Named ANSI colours are what fastfetch, starship, eza, bat and btop resolve
# against, so the whole terminal stack inherits this palette automatically.

# black
color0  #1f1a1a
color8  #4b3f3f
# red — armour red
color1  #e62429
color9  #ff4d52
# green
color2  #7bd88f
color10 #9cf0ae
# yellow — armour gold
color3  #f0a020
color11 #ffc35c
# blue — reactor cyan
color4  #55d9f0
color12 #86e8ff
# magenta
color5  #d05a9e
color13 #f07ac0
# cyan
color6  #4fc9d9
color14 #7fe3f0
# white
color7  #d8d2d0
color15 #f5efed

# ============================================================================
#  Keys
# ============================================================================
map ctrl+shift+enter  new_window
map ctrl+shift+t      new_tab
map ctrl+shift+w      close_window
map ctrl+shift+left   previous_tab
map ctrl+shift+right  next_tab
map ctrl+plus         change_font_size all +1.0
map ctrl+minus        change_font_size all -1.0
map ctrl+0            change_font_size all 0
map ctrl+shift+f      show_scrollback
